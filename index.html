  if(s[0]==="idf")h+='<p class="note">פגישות הרמטכ״ל עם בכירים מחו״ל ועם הדרג הפיקודי: לא נמצא דיווח עדכני על פגישה כזו בשבועות האחרונים, והיא תופיע כאן כשתפורסם.</p>';
  h+=it.length?'<div class="g">'+it.map(card).join("")+'</div>':'<p class="note">אין עדכונים כרגע.</p>';
  h+='</section>'});
 document.getElementById("mn").innerHTML=h;
 document.getElementById("tk").textContent=IT.slice(0,5).map(function(x){return x.h}).join("   ●   ");
}
function nav(){
 var h="";[["all","הכול"]].concat(S).forEach(function(s){h+='<button type="button" data-i="'+s[0]+'" aria-pressed="'+(s[0]===cur)+'">'+e(s[1])+'</button>'});
 var n=document.getElementById("nv");n.innerHTML=h;
 n.onclick=function(ev){var b=ev.target.closest("button");if(!b)return;cur=b.dataset.i;nav();draw();window.scrollTo(0,0)};
}
function load(){
 fetch("data.json?t="+Date.now()).then(function(r){return r.json()}).then(function(j){
  build(j.items);document.getElementById("up").textContent="עודכן: "+new Date(j.updated).toLocaleString("he-IL",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"});draw();
 }).catch(function(){build([]);draw()});
}
document.getElementById("dt").textContent=new Date().toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
document.getElementById("th").onclick=function(){var r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=d?"light":"dark"};
build([]);nav();draw();load();setInterval(load,14*60*1000);
</script>
</body>
