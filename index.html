<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מוקד ביטחון – עדכונים שוטפים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@900&family=Assistant:wght@400;600;700&display=swap">
<style>
:root{--bg:#eef0e8;--surface:#fafaf5;--ink:#1d2418;--muted:#5d664f;--line:#cfd4c2;--olive:#4b5a3c;--alert:#b4531a;--idf:#4b5a3c;--mossad:#2f4a6b;--shin:#6b3a5c;--gov:#8a6a1c}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#161a12;--surface:#1f2419;--ink:#e8ebdf;--muted:#a3ab94;--line:#38402f;--olive:#9bb07f;--alert:#e08a4f;--idf:#9bb07f;--mossad:#7fa3cf;--shin:#c98fb8;--gov:#d4b45c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Assistant,Arial,sans-serif;font-size:17px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{padding:28px 0 14px;border-bottom:3px solid var(--olive)}
h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:900;font-size:clamp(34px,7vw,56px);line-height:1.05;margin:0}
.sub{color:var(--muted);margin:6px 0 0}
.live{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:600;color:var(--alert)}
.live i{width:10px;height:10px;border-radius:50%;background:var(--alert)}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;padding:5px 14px;border-radius:20px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--bg)}
.chip:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--alert);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);padding:8px 10px;border-radius:6px;width:100%;margin-top:8px}
.feed{padding:10px 0 40px}
.day{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:22px;margin:26px 0 8px}
.item{background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--c);padding:10px 16px;margin-bottom:10px}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.tag{font-weight:700;color:var(--c)}
.item h3{margin:2px 0 2px;font-size:18px;line-height:1.4}
.item a{color:var(--ink)}
.empty{padding:30px 0;color:var(--muted);text-align:center}
footer{padding:20px 0 40px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>מוקד ביטחון</h1>
<p class="sub">עדכונים שוטפים: ראש הממשלה, שר הביטחון, ראש המוסד וראש השב״כ</p>
<div class="live"><i></i><span id="upd">טוען…</span></div>
</header>
<div class="bar">
<div class="chips" id="chips" role="group" aria-label="סינון לפי נושא"></div>
<input id="q" type="search" placeholder="חיפוש בעדכונים" aria-label="חיפוש בעדכונים">
</div>
<main class="feed" id="feed" aria-live="polite"></main>
<footer>הכותרות נאספות אוטומטית מאתרי חדשות, והקישור מוביל לכתבה המלאה. דף זה אינו אתר רשמי.</footer>
</div>
<script>
var CATS=[{id:"pm",n:"ראש הממשלה",c:"--gov"},{id:"def",n:"שר הביטחון",c:"--idf"},{id:"mossad",n:"ראש המוסד",c:"--mossad"},{id:"shin",n:"ראש השב״כ",c:"--shin"}];
var DATA=[],cur="all",REFRESH_MS=14*60*1000;
function cat(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i];return CATS[0]}
function esc(s){var e=document.createElement("div");e.textContent=s;return e.innerHTML}
function render(){
 var q=document.getElementById("q").value.trim(),out="",last="";
 DATA.filter(function(x){return(cur==="all"||x.cat===cur)&&(!q||x.title.indexOf(q)>=0)}).forEach(function(x){
  var d=new Date(x.ts),day=d.toLocaleDateString("he-IL",{day:"numeric",month:"long",year:"numeric"}),k=cat(x.cat);
  if(day!==last){out+='<div class="day">'+esc(day)+'</div>';last=day}
  out+='<article class="item" style="--c:var('+k.c+')"><div class="meta"><span class="tag">'+esc(k.n)+'</span><span>'+esc(x.source)+'</span><time>'+d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})+'</time></div><h3><a href="'+encodeURI(x.link)+'" target="_blank" rel="noopener">'+esc(x.title)+'</a></h3></article>'});
 document.getElementById("feed").innerHTML=out||'<div class="empty">אין עדכונים בנושא הזה כרגע.</div>';
}
function chips(){
 var h="";[{id:"all",n:"הכול"}].concat(CATS).forEach(function(c){h+='<button type="button" class="chip" data-id="'+c.id+'" aria-pressed="'+(c.id===cur)+'">'+c.n+'</button>'});
 var el=document.getElementById("chips");el.innerHTML=h;
 el.onclick=function(e){var b=e.target.closest(".chip");if(!b)return;cur=b.dataset.id;chips();render()};
}
function load(){
 fetch("data.json?t="+Date.now()).then(function(r){return r.json()}).then(function(j){
  DATA=j.items||[];
  document.getElementById("upd").textContent="עודכן לאחרונה: "+new Date(j.updated).toLocaleString("he-IL",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"});
  render();
 }).catch(function(){document.getElementById("upd").textContent="לא ניתן לטעון עדכונים"});
}
document.getElementById("q").oninput=render;
chips();load();setInterval(load,REFRESH_MS);
</script>
</body>
</html>
